        '500':
          $ref: '#/components/responses/EmailActionInternalError'
        '503':
          $ref: '#/components/responses/EmailActionUnavailable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
      x-implementation-status: planned
components:
  securitySchemes:
    BearerSession:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: Случайная отзываемая серверная сессия. Не JWT.
  schemas:
    EventTime:
      type: object
      additionalProperties: false
      required:
      - precision
      - date
      - time
      - timeZone
      - instant
      properties:
        precision:
          type: string
          enum:
          - DATE
          - MINUTE
        date:
          type: string
          format: date
        time:
          anyOf:
          - type: string
            pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
          - type: 'null'
        timeZone:
          anyOf:
          - type: string
            minLength: 1
          - type: 'null'
        instant:
          anyOf:
          - &id005
            type: string
            format: date-time
          - type: 'null'
      description: 'DATE: time и instant null. MINUTE: time,timeZone,instant обязательны
        non-null и согласованы. Не придумывать 23:59.'
      allOf:
      - if:
          properties:
            precision:
              const: DATE
        then:
          properties:
            time:
              type: 'null'
            instant:
              type: 'null'
      - if:
          properties:
            precision:
              const: MINUTE
        then:
          properties:
            time:
              type: string
            timeZone:
              type: string
              minLength: 1
            instant: *id005
    Organizer:
      type: object
      additionalProperties: false
      required:
      - name
      - websiteUrl
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 160
        websiteUrl:
          anyOf:
          - &id008
            type: string
            format: uri
            pattern: ^https://
          - type: 'null'
    Location:
      type: object
      additionalProperties: false
      required:
      - countryCode
      - city
      - venue
      properties:
        countryCode:
          anyOf:
          - *id006
          - type: 'null'
        city:
          anyOf:
          - type: string
            maxLength: 100
          - type: 'null'
        venue:
          anyOf:
          - type: string
            maxLength: 300
          - type: 'null'
      description: Место события. География допуска участников хранится отдельно.
    TeamRules:
      type: object
      additionalProperties: false
      required:
      - minSize
      - maxSize
      - individualApplicationAllowed
      - soloParticipationAllowed
      - teamFormationAvailable
      properties:
        minSize:
          anyOf:
          - type: integer
            minimum: 1
            maximum: 100
          - type: 'null'
        maxSize:
          anyOf:
          - type: integer
            minimum: 1
            maximum: 100
          - type: 'null'
        individualApplicationAllowed:
          anyOf:
          - type: boolean
          - type: 'null'
        soloParticipationAllowed:
          anyOf:
          - type: boolean
          - type: 'null'
        teamFormationAvailable:
          anyOf:
          - type: boolean
          - type: 'null'
    Prize:
      type: object
      additionalProperties: false
      required:
      - status
      - totalAmount
      - currency
      - kind
      - summary
      properties:
        status:
          type: string
          enum:
          - ANNOUNCED
          - NONE
          - UNKNOWN
        totalAmount:
          anyOf:
          - type: string
            pattern: ^[0-9]+(\.[0-9]{1,6})?$
          - type: 'null'
        currency:
          anyOf:
          - type: string
            pattern: ^[A-Z]{3}$
          - type: 'null'
        kind:
          type: string
          enum:
          - CASH
          - NON_CASH
          - MIXED
          - UNSPECIFIED
        summary:
          anyOf:
          - type: string
            maxLength: 500
          - type: 'null'
      description: Десятичная строка, не float. null не означает 0. Для mixed фонд
        не выдавать за только денежный.
    Tag:
      type: object
      additionalProperties: false
      required:
      - id
      - label
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 50
        label:
          type: string
          minLength: 1
          maxLength: 80
    HackathonSummary:
      type: object
      additionalProperties: false
      required:
      - id
      - slug
      - title
      - shortDescription
      - organizer
      - format
      - location
      - starts
      - ends
      - registrationDeadline
      - registrationStatus
      - eventStatus
      - topics
      - prize
      - team
      - imageUrl
      - artworkKey
      - lastVerifiedAt
      - updatedAt
      - isDemo
      properties:
        id: *id007
        slug:
          type: string
          pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
        title:
