openapi: 3.1.0
info:
  title: HackAtlas Mobile API
  version: 0.1.1
  description: Проектный контракт для общей реализации. Наличие операции в спецификации
    не означает, что она реализована. Этап указан в x-phase. Семантика в README.md.
x-account-lifecycle-stage: contract-only
x-email-verification-enforced: false
servers:
- url: http://localhost:8080/api/v1
  description: Только локальная разработка; base URL переопределяется под устройство.
    Production — HTTPS.
paths:
  /hackathons:
    get:
      operationId: listHackathons
      summary: Публичный каталог
      x-phase: B1
      security: []
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HackathonPage'
        '400':
          description: Некорректные данные
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: Лимит запросов
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          headers:
            Retry-After:
              schema:
                type: string
              description: Задержка повтора в секундах.
        '500':
          description: Ошибка сервера
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: Сервис недоступен
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      parameters:
      - name: query
        in: query
        required: false
        schema:
          type: string
          maxLength: 120
        description: Поиск по названию, организатору, теме и городу; пустой после
          trim = без поиска.
      - name: format
        in: query
        required: false
        schema:
          type: string
          enum:
          - ONLINE
          - OFFLINE
          - HYBRID
        description: ''
      - name: countryCode
        in: query
        required: false
        schema: &id006
          type: string
          pattern: ^[A-Z]{2}$
        description: Место проведения, не eligibility.
      - name: city
        in: query
        required: false
        schema:
          type: string
          maxLength: 100
        description: ''
      - name: topic
        in: query
        required: false
        schema:
          type: string
          maxLength: 50
        description: Один topic id из metadata.
      - name: registrationStatus
        in: query
        required: false
        schema:
          type: string
          enum:
          - OPEN
          - CLOSED
          - UPCOMING
          - UNKNOWN
        description: ''
      - name: individualApplicationAllowed
        in: query
        required: false
        schema:
          type: boolean
        description: true включает только явно true, не unknown.
      - name: startsFrom
        in: query
        required: false
        schema:
          type: string
          format: date
        description: ''
      - name: startsTo
        in: query
        required: false
        schema:
          type: string
          format: date
        description: ''
      - name: sort
        in: query
        required: false
        schema:
          type: string
          enum:
          - DEADLINE_ASC
          - START_ASC
          - NEWEST
        description: По умолчанию DEADLINE_ASC; unknown last; tie-breaker id.
      - &id001
        name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
        description: ''
      - &id002
        name: size
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 50
          default: 20
        description: ''
