        detail:
          type: string
        instance:
          type: string
        code:
          type: string
          enum:
          - VALIDATION_ERROR
          - AUTH_REQUIRED
          - INVALID_CREDENTIALS
          - FORBIDDEN
          - NOT_FOUND
          - EMAIL_ALREADY_EXISTS
          - RATE_LIMITED
          - INTERNAL_ERROR
          - SERVICE_UNAVAILABLE
        requestId:
          type: string
        fieldErrors:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - field
            - message
            properties:
              field:
                type: string
              message:
                type: string
    SuggestionRequest:
      type: object
      additionalProperties: false
      required:
      - url
      - comment
      properties:
        url: *id008
        comment:
          anyOf:
          - type: string
            maxLength: 2000
          - type: 'null'
    ReportRequest:
      type: object
      additionalProperties: false
      required:
      - reason
      - message
      properties:
        reason:
          type: string
          enum:
          - DATES
          - LINK
          - PRIZE
          - ELIGIBILITY
          - DUPLICATE
          - OTHER
        message:
          type: string
          minLength: 5
          maxLength: 2000
    SubmissionReceipt:
      type: object
      additionalProperties: false
      required:
      - id
      - status
      properties:
        id: *id007
        status:
          type: string
          enum:
          - PENDING
    DeleteAccountRequest:
      type: object
      additionalProperties: false
      required:
      - password
      properties:
        password:
          type: string
          minLength: 1
          maxLength: 256
          writeOnly: true
    LifecycleProblem:
      type: object
      additionalProperties: false
      required:
      - type
      - title
      - status
      - detail
      - instance
      - code
      - requestId
      - fieldErrors
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
          enum:
          - VALIDATION_ERROR
          - AUTH_REQUIRED
          - INVALID_CREDENTIALS
          - FORBIDDEN
          - NOT_FOUND
          - EMAIL_ALREADY_EXISTS
          - RATE_LIMITED
          - INTERNAL_ERROR
          - SERVICE_UNAVAILABLE
          - EMAIL_NOT_VERIFIED
          - EMAIL_ACTION_INVALID
          - PASSWORD_RESET_REQUIRED
        requestId:
          type: string
        fieldErrors:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - field
            - message
            properties:
              field:
                type: string
              message:
                type: string
      description: Планируемая lifecycle ошибка. Старые операции продолжают использовать
        прежний Problem.
    EmailActionChallenge:
      type: object
      additionalProperties: false
      required:
      - challengeId
      - expiresAt
      - resendAfterSeconds
      properties:
        challengeId:
          type: string
          minLength: 43
          maxLength: 43
          pattern: ^[A-Za-z0-9_-]{43}$
          description: Синтетические примеры не являются действующими credentials; в реальности 256-bit CSPRNG.
          x-sensitive: true
        expiresAt:
          type: string
          format: date-time
        resendAfterSeconds:
          type: integer
          const: 60
      description: Принят к best-effort обработке; не подтверждает наличие аккаунта или доставку письма.
    EmailCodeRequest:
      type: object
      additionalProperties: false
      required:
      - challengeId
      - code
      properties:
        challengeId:
          type: string
          minLength: 43
          maxLength: 43
          pattern: ^[A-Za-z0-9_-]{43}$
          description: Синтетические примеры не являются действующими credentials; в реальности 256-bit CSPRNG.
          x-sensitive: true
          writeOnly: true
        code:
          type: string
          minLength: 8
          maxLength: 8
          pattern: ^[0-9]{8}$
          writeOnly: true
          description: Восемь ASCII цифр, включая ведущие нули. Не логировать.
    PasswordResetRequest:
      type: object
      additionalProperties: false
      required:
      - email
      properties:
        email:
          type: string
          format: email
          maxLength: 254
    PasswordResetGrant:
      type: object
      additionalProperties: false
      required:
      - resetToken
      - expiresAt
      properties:
        resetToken:
          type: string
          minLength: 43
          maxLength: 43
          pattern: ^[A-Za-z0-9_-]{43}$
          description: Синтетические примеры не являются действующими credentials; в реальности 256-bit CSPRNG.
          x-sensitive: true
        expiresAt:
          type: string
          format: date-time
      description: Один reset в течение пяти минут. Не Bearer, не refresh token, не авторизация.
    PasswordResetConfirmRequest:
      type: object
      additionalProperties: false
      required:
      - resetToken
      - newPassword
      properties:
        resetToken:
          type: string
          minLength: 43
          maxLength: 43
          pattern: ^[A-Za-z0-9_-]{43}$
          description: Синтетические примеры не являются действующими credentials; в реальности 256-bit CSPRNG.
          x-sensitive: true
          writeOnly: true
        newPassword:
          type: string
          minLength: 12
          maxLength: 256
          writeOnly: true
          description: 'Как RegisterRequest: не trim, не логировать, не сохранять на клиенте.'
  responses:
    EmailActionAccepted:
      description: PLANNED. Принят к обработке, не обещает письмо или наличие аккаунта.
      headers:
        Cache-Control:
          required: true
          schema:
            type: string
            const: no-store
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/EmailActionChallenge'
    EmailActionNoContent:
      description: PLANNED. Действие завершено; тело и новый Bearer отсутствуют.
      headers:
        Cache-Control:
          required: true
          schema:
            type: string
            const: no-store
    PasswordResetGrantIssued:
      description: PLANNED. Код потреблён; выдан одноразовый reset-only grant.
      headers:
        Cache-Control:
          required: true
          schema:
            type: string
            const: no-store
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PasswordResetGrant'
    EmailActionBadRequest:
      description: PLANNED. Некорректная форма либо недействительный code/grant.
      headers:
        Cache-Control:
          required: true
          schema:
            type: string
            const: no-store
      content:
        application/problem+json:
          schema:
            allOf:
            - $ref: '#/components/schemas/LifecycleProblem'
            - type: object
              properties:
                status:
                  const: 400
                code:
                  enum:
                  - VALIDATION_ERROR
                  - EMAIL_ACTION_INVALID
    EmailActionUnauthorized:
      description: PLANNED. Недействителен приложенный Bearer; это не ошибка кода.
      headers:
        Cache-Control:
          required: true
          schema:
            type: string
            const: no-store
      content:
        application/problem+json:
          schema:
            allOf:
            - $ref: '#/components/schemas/LifecycleProblem'
            - type: object
              properties:
                status:
                  const: 401
                code:
                  enum:
                  - AUTH_REQUIRED
    EmailActionLimited:
      description: PLANNED. Общий лимит; не account-existence oracle.
      headers:
        Cache-Control:
          required: true
          schema:
            type: string
            const: no-store
        Retry-After:
          required: true
          schema:
            type: string
            pattern: ^[1-9][0-9]*$
          description: Число секунд до следующей попытки.
      content:
        application/problem+json:
          schema:
            allOf:
            - $ref: '#/components/schemas/LifecycleProblem'
            - type: object
              properties:
                status:
                  const: 429
                code:
                  enum:
                  - RATE_LIMITED
    EmailActionInternalError:
      description: PLANNED. Без credentials и внутренних деталей.
      headers:
        Cache-Control:
          required: true
          schema:
            type: string
            const: no-store
      content:
        application/problem+json:
          schema:
            allOf:
            - $ref: '#/components/schemas/LifecycleProblem'
            - type: object
              properties:
                status:
                  const: 500
                code:
                  enum:
                  - INTERNAL_ERROR
    EmailActionUnavailable:
      description: PLANNED. Общая недоступность/admission отказ.
      headers:
        Cache-Control:
          required: true
          schema:
            type: string
            const: no-store
      content:
        application/problem+json:
          schema:
            allOf:
            - $ref: '#/components/schemas/LifecycleProblem'
            - type: object
              properties:
                status:
                  const: 503
                code:
                  enum:
                  - SERVICE_UNAVAILABLE
    EmailVerificationRequired:
      description: PLANNED. Нужна подтверждённая почта или доступ запрещён.
      headers:
        Cache-Control:
          required: true
          schema:
            type: string
            const: no-store
      content:
        application/problem+json:
          schema:
            allOf:
            - $ref: '#/components/schemas/LifecycleProblem'
            - type: object
              properties:
                status:
                  const: 403
                code:
                  enum:
                  - EMAIL_NOT_VERIFIED
                  - FORBIDDEN
    PasswordRecoveryRequired:
      description: PLANNED. После восстановления backup нужен email reset.
      headers:
        Cache-Control:
          required: true
          schema:
            type: string
            const: no-store
      content:
        application/problem+json:
          schema:
            allOf:
            - $ref: '#/components/schemas/LifecycleProblem'
            - type: object
              properties:
                status:
                  const: 403
                code:
                  enum:
                  - PASSWORD_RESET_REQUIRED
security: []
