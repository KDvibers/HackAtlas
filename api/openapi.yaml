          application/json:
            schema:
              $ref: '#/components/schemas/EmailCodeRequest'
      x-implementation-status: planned
  /auth/password-reset/confirm:
    post:
      operationId: confirmPasswordReset
      summary: Установить новый пароль по reset grant
      description: 'PLANNED, не реализовано. Без Bearer. Атомарно: password hash, credential version, emailVerified=true,
        снятие restore reset-required, отзыв всех native/admin sessions и остальных codes/grants. 204 без
        login; повтор grant → 400 EMAIL_ACTION_INVALID. К обычным protected requests token не подходит.'
      x-phase: ACCOUNT_LIFECYCLE
      security: []
      responses:
        '204':
          $ref: '#/components/responses/EmailActionNoContent'
