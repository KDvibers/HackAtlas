              $ref: '#/components/schemas/EmailCodeRequest'
      x-implementation-status: planned
  /auth/password-reset/request:
    post:
      operationId: requestPasswordReset
      summary: Запросить восстановление пароля
      description: PLANNED, не реализовано. Клиент не прикладывает Bearer. Для корректного email одинаковый
        202, включая неизвестный/удалённый. Новый запрос не отзывает sessions и не отменяет ранее выданные
        codes/grants. Письмо не гарантировано. 401 возможен только если клиент всё же приложил недействительный
        Bearer.
      x-phase: ACCOUNT_LIFECYCLE
      security: []
      responses:
        '202':
          $ref: '#/components/responses/EmailActionAccepted'
        '400':
          $ref: '#/components/responses/EmailActionBadRequest'
        '401':
          $ref: '#/components/responses/EmailActionUnauthorized'
        '429':
          $ref: '#/components/responses/EmailActionLimited'
        '500':
          $ref: '#/components/responses/EmailActionInternalError'
        '503':
          $ref: '#/components/responses/EmailActionUnavailable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
      x-implementation-status: planned
  /auth/password-reset/verify:
    post:
      operationId: verifyPasswordResetCode
      summary: Обменять код на одноразовый reset grant
      description: PLANNED, не реализовано. Без Bearer. Код потребляется атомарно; аккаунт/пароль/verified
        пока не меняются. 400 для всех недействительных challenges; 200 не является login.
      x-phase: ACCOUNT_LIFECYCLE
      security: []
      responses:
        '200':
          $ref: '#/components/responses/PasswordResetGrantIssued'
        '400':
          $ref: '#/components/responses/EmailActionBadRequest'
        '401':
