              $ref: '#/components/schemas/ReportRequest'
      parameters:
      - *id003
  /me/delete-account:
    post:
      operationId: deleteAccount
      summary: Удалить аккаунт с проверкой пароля
      x-phase: B3
      security:
      - BearerSession: []
      responses:
        '204':
          description: Нет содержимого
        '400':
          description: Некорректные данные
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Авторизация отсутствует/недействительна
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: Лимит запросов
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          headers:
            Retry-After:
              schema:
                type: string
              description: Задержка повтора в секундах.
        '500':
          description: Ошибка сервера
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: Сервис недоступен
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteAccountRequest'
  /auth/email-verification/request:
    post:
      operationId: requestEmailVerification
      summary: Запросить код подтверждения почты
      description: PLANNED, не реализовано. Адрес берётся из principal. Без тела. 204, если уже verified;
        иначе 202. Pending Bearer разрешён.
      x-phase: ACCOUNT_LIFECYCLE
      security:
      - BearerSession: []
      responses:
        '202':
          $ref: '#/components/responses/EmailActionAccepted'
        '204':
          $ref: '#/components/responses/EmailActionNoContent'
        '400':
          $ref: '#/components/responses/EmailActionBadRequest'
        '401':
          $ref: '#/components/responses/EmailActionUnauthorized'
        '429':
          $ref: '#/components/responses/EmailActionLimited'
        '500':
