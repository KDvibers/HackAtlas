          - type: 'null'
        minAge:
          anyOf:
          - type: integer
            minimum: 0
            maximum: 120
          - type: 'null'
        maxAge:
          anyOf:
          - type: integer
            minimum: 0
            maximum: 120
          - type: 'null'
        studentsOnly:
          anyOf:
          - type: boolean
          - type: 'null'
        languages:
          type: array
          items:
            type: string
            maxLength: 80
          maxItems: 20
      description: null allowedCountryCodes = неизвестно, [] = явно без географического
        ограничения. Это не место проведения.
    Stage:
      type: object
      additionalProperties: false
      required:
      - title
      - when
      - description
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 160
        when:
