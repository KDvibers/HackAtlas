          - $ref: '#/components/schemas/EventTime'
          - type: 'null'
        ends:
          anyOf:
          - $ref: '#/components/schemas/EventTime'
          - type: 'null'
        registrationDeadline:
          anyOf:
          - $ref: '#/components/schemas/EventTime'
          - type: 'null'
        registrationStatus:
          type: string
          enum:
          - OPEN
          - CLOSED
          - UPCOMING
          - UNKNOWN
        eventStatus:
          type: string
          enum:
          - SCHEDULED
          - ONGOING
          - ENDED
          - POSTPONED
          - CANCELLED
        topics:
          type: array
          items:
            $ref: '#/components/schemas/Tag'
