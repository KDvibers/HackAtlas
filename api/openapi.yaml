  /auth/email-verification/confirm:
    post:
      operationId: confirmEmailVerification
      summary: Подтвердить почту кодом
      description: 'PLANNED, не реализовано. Нужен Bearer того же аккаунта и код. Успех 204 → GET /me. Replay/expired/wrong-purpose:
        generic 400.'
      x-phase: ACCOUNT_LIFECYCLE
      security:
      - BearerSession: []
      responses:
        '204':
          $ref: '#/components/responses/EmailActionNoContent'
        '400':
          $ref: '#/components/responses/EmailActionBadRequest'
        '401':
          $ref: '#/components/responses/EmailActionUnauthorized'
        '429':
