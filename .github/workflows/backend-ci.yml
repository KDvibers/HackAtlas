name: Backend CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Contract check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements-contract.txt
      - name: Install contract validator dependencies
        run: python -m pip install --disable-pip-version-check --requirement scripts/requirements-contract.txt
      - name: Check dependency consistency
        run: python -m pip check
      - name: Validate canonical contract and fixtures
        run: python scripts/validate_contract.py

  backend:
    name: Backend verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Java 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: |
            backend/pom.xml
            backend/.mvn/wrapper/maven-wrapper.properties
          overwrite-settings: false
      - name: Require a working Docker daemon for Testcontainers
        run: docker version
      - name: Build and test with the Maven Wrapper
        run: bash ./mvnw --batch-mode --no-transfer-progress verify
      - name: Set up Python for real HTTP contract checks
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/b1/requirements.txt
      - name: Set up Node for the Bruno CLI
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: tools/bruno/package-lock.json
      - name: Install pinned HTTP verification tools
        working-directory: .
        run: |
          python -m venv scripts/b1/.venv
          scripts/b1/.venv/bin/python -m pip install --disable-pip-version-check --requirement scripts/b1/requirements.txt
          scripts/b1/.venv/bin/python -m pip check
      - name: Validate integration-test HTTP responses against OpenAPI
        run: >-
          ../scripts/b1/.venv/bin/python src/test/resources/validate_http_contract.py
          --schema ../api/openapi.yaml --responses target/catalog-contract-responses.json
      - name: Validate B2 HTTP responses against OpenAPI
        run: >-
          ../scripts/b1/.venv/bin/python src/test/resources/validate_http_contract.py
          --schema ../api/openapi.yaml --responses target/b2-contract
      - name: Validate B3 HTTP responses against OpenAPI
        run: >-
          ../scripts/b1/.venv/bin/python src/test/resources/validate_http_contract.py
          --schema ../api/openapi.yaml --responses target/b3-contract
      - name: Install the pinned Bruno CLI
        working-directory: tools/bruno
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify the packaged B1 API with isolated PostgreSQL, Bruno and Schemathesis
        working-directory: .
        run: >-
          scripts/b1/.venv/bin/python scripts/b1/run_contract_checks.py
          --jar backend/target/hackatlas-backend-0.1.0-SNAPSHOT.jar
      - name: Verify the packaged B2 API with isolated PostgreSQL and Bruno
        working-directory: .
        run: >-
          scripts/b1/.venv/bin/python scripts/b2/run_contract_checks.py
          --jar backend/target/hackatlas-backend-0.1.0-SNAPSHOT.jar
      - name: Verify the packaged B3 API with isolated PostgreSQL and Bruno
        working-directory: .
        run: >-
          scripts/b1/.venv/bin/python scripts/b3/run_contract_checks.py
          --jar backend/target/hackatlas-backend-0.1.0-SNAPSHOT.jar

  secrets:
    name: Gitleaks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify Gitleaks download and scan history
        shell: bash
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          tool_dir="$(mktemp -d)"
          archive="$tool_dir/gitleaks.tar.gz"
          curl --fail --silent --show-error --location \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$GITLEAKS_SHA256" "$archive" | sha256sum --check --strict
          tar --extract --gzip --file "$archive" --directory "$tool_dir" gitleaks
          "$tool_dir/gitleaks" version
          "$tool_dir/gitleaks" git --redact=100 --no-banner --log-opts="--all" .
