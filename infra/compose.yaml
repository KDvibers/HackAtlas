name: hackatlas-dev

services:
  postgres:
    image: postgres:17.11-bookworm@sha256:3645570cccdfa447589da9f57dd740faa29b30938e861289a5574b6ca6b03826
    environment:
      POSTGRES_DB: hackatlas
      POSTGRES_USER: ${HACKATLAS_DB_USERNAME:?Set HACKATLAS_DB_USERNAME in infra/.env}
      POSTGRES_PASSWORD: ${HACKATLAS_DB_PASSWORD:?Set HACKATLAS_DB_PASSWORD in infra/.env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  postgres-data:
