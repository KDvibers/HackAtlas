spring:
  application:
    name: hackatlas-backend
  profiles:
    default: prod
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: hackatlas
  flyway:
    enabled: true
    default-schema: public
    create-schemas: false
    clean-disabled: true
    validate-on-migrate: true
    baseline-on-migrate: false
  sql:
    init:
      mode: never
  web:
    error:
      include-message: never
      include-stacktrace: never
      include-binding-errors: never
      include-exception: false

server:
  address: ${HACKATLAS_BIND_ADDRESS:127.0.0.1}
  port: ${PORT:8080}
  shutdown: graceful

management:
  endpoints:
    access:
      default: none
    web:
      exposure:
        include: health
      discovery:
        enabled: false
    jmx:
      exposure:
        exclude: "*"
  endpoint:
    health:
      access: read-only
      show-details: never
      show-components: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
