spring:
  application:
    name: hackatlas-backend
  profiles:
    default: prod
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: hackatlas
  flyway:
    enabled: true
    default-schema: public
    create-schemas: false
    clean-disabled: true
    validate-on-migrate: true
    baseline-on-migrate: false
  sql:
    init:
      mode: never
  web:
    error:
      include-message: never
      include-stacktrace: never
      include-binding-errors: never
      include-exception: false

server:
  forward-headers-strategy: none
  servlet:
    session:
      timeout: 30m
      tracking-modes: cookie
      cookie:
        name: HACKATLAS_ADMIN_SESSION
        path: /admin
        http-only: true
        same-site: strict
        secure: true
  address: ${HACKATLAS_BIND_ADDRESS:127.0.0.1}
  port: ${PORT:8080}
  shutdown: graceful

management:
  endpoints:
    access:
      default: none
    web:
      exposure:
        include: health
      discovery:
        enabled: false
    jmx:
      exposure:
        exclude: "*"
  endpoint:
    health:
      access: read-only
      show-details: never
      show-components: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db

# These framework categories can include SQL exception text or bound row values.
# Request handlers retain sanitized requestId/type/SQLState diagnostics instead.
logging:
  level:
    org.springframework.transaction.interceptor.TransactionInterceptor: "OFF"
    org.hibernate.orm.jdbc.error: "OFF"
    com.zaxxer.hikari.pool.ProxyConnection: "OFF"

hackatlas:
  moderation:
    rate-limit:
      window: PT1H
      ip-limit: 60
      account-limit: 20
      max-keys: 10000
  auth:
    registration-enabled: ${HACKATLAS_REGISTRATION_ENABLED:false}
    session-ttl: ${HACKATLAS_SESSION_TTL:P30D}
    rate-limit:
      window: PT15M
      ip-limit: 30
      account-limit: 10
      max-keys: 10000
