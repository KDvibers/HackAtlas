spring:
  config:
    activate:
      on-profile: "dev & !prod"
    import: optional:file:../infra/.env[.properties]
  datasource:
    url: ${HACKATLAS_DB_URL:jdbc:postgresql://localhost:5432/hackatlas}
    username: ${HACKATLAS_DB_USERNAME:hackatlas}
    password: ${HACKATLAS_DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
      connection-timeout: 5000

server:
  servlet:
    session:
      cookie:
        secure: false
